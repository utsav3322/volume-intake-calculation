[project]
name = "cowmonitor-streamlit"
version = "0.1.0"
description = "Streamlit app that runs the Zalliant 2024 cow-health models on an uploaded CSV file"
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "ANN", "S", "RUF", "TID"]
ignore = ["ANN401"]
allowed-confusables = ["–", "×", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TID251"]
"app.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"streamlit".msg = "Only app.py may import Streamlit; keep the cowmonitor package UI-free."

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "unit: fast tests on small synthetic data",
    "integration: tests on the project's delivered CSV files (skipped if they are missing)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
